[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-orchestrator"
version = "1.0.0"
description = "A high-performance multi-agent framework with stateful task routing, shared semantic memory, and tool integration."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
